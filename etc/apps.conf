# /etc/apps.conf  -  Application list for the GUI desktop environment
# Format: name|path|icon|color
# - name:  display name (shown under icon and in menu)
# - path:  full path to .lua file
# - icon:  single character (e.g. "T") or short label (max 3 chars)
# - color: one of CC:T color names (white, orange, magenta, lightBlue,
#          yellow, lime, pink, gray, lightGray, cyan, purple, blue,
#          brown, green, red, black)
# Lines starting with # are comments. Order = display order.
#
# To add a new app: just append a line here. No code changes needed.
# To remove an app: delete its line. Done.

Terminal|/bin/sh.lua|T|green
Files|/usr/bin/filemanager.lua|F|yellow
Editor|/usr/bin/editor.lua|E|cyan
Web Browser|/usr/bin/webbrowser.lua|W|blue
Notes|/usr/bin/notes.lua|N|orange
Paint|/usr/bin/paint.lua|P|magenta
Calculator|/usr/bin/calculator.lua|C|lime
Clock|/usr/bin/clock.lua|L|lightBlue
Music Player|/usr/bin/player.lua|M|purple
Lua REPL|/usr/bin/lua-repl.lua|>|pink
System Monitor|/usr/bin/system-monitor.lua|S|red
Task Manager|/usr/bin/taskmgr.lua|K|cyan
Neofetch|/usr/bin/neofetch.lua|?|lightBlue
Monitor Cast|/usr/bin/monitor-cast.lua|MC|purple
Print|/usr/bin/print.lua|PR|red
